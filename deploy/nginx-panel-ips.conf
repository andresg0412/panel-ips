# /etc/nginx/sites-available/panel-ips  (enlazado en sites-enabled)
# Configuración FINAL, con el login propio del panel: nginx ya NO autentica (sin auth_basic ni X-Remote-User).
#
# ATENCIÓN: el archivo vivo del droplet tiene los bloques de certbot (listen 443 ssl, certificados, redirección de
# HTTP a HTTPS) que NO están aquí. Este archivo NO se copia tal cual: se aplica el cambio SOBRE el archivo vivo.
# Orden del despliegue y rollback: proyecto-ips/docs/features/2026-11-04-panel-login-autenticacion.md, 19.3 y 19.6.
# Probar siempre con `nginx -t && systemctl reload nginx` (nunca `restart`).

# Va ANTES del bloque server. Solo limita las rutas sensibles: el latido y las sesiones no consumen este límite.
limit_req_zone $binary_remote_addr zone=panel_auth:1m rate=10r/m;

server {
    server_name panel-ips.zentrixsolucionesdigitales.com;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ ^/api/auth/(login|recuperar/) {
        limit_req zone=panel_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # La aplicación usa X-Real-IP (siempre $remote_addr) para los límites y la auditoría; nunca X-Forwarded-For.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Vacía: la cabecera que mande el navegador no llega al panel, ni siquiera en un rollback a medias.
        proxy_set_header X-Remote-User "";
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Remote-User "";
        proxy_read_timeout 30s;
    }

    # ... bloques de certbot (listen 443 ssl, certificados) sin cambios ...
}
