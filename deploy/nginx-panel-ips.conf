# /etc/nginx/sites-available/panel-ips  (enlazado en sites-enabled)
# Archivo propio del panel: el sitio "default" del bot (webhook de Meta) no se toca.
# certbot --nginx agrega después el bloque 443 y la redirección de HTTP a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name panel-ips.zentrixsolucionesdigitales.com;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        auth_basic "Panel IPS";
        auth_basic_user_file /etc/nginx/.htpasswd-panel-ips;

        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Usuario autenticado, para mostrarlo en el panel. nginx sobrescribe cualquier valor que mande el navegador.
        proxy_set_header X-Remote-User $remote_user;
        proxy_read_timeout 30s;
    }
}
